<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interface Melhorada</title>
  <style>
    :root{
      --bg:#0f172a;
      --card:#111827;
      --muted:#94a3b8;
      --text:#e5e7eb;
      --primary:#3b82f6;
      --primary-hover:#2563eb;
      --border:#1f2937;
      --ok:#22c55e;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family: Inter, Segoe UI, Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #0b1220, #111827 45%, #0f172a);
      color:var(--text);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .app{
      width:min(960px, 100%);
      background:rgba(17,24,39,.88);
      border:1px solid var(--border);
      border-radius:18px;
      padding:24px;
      box-shadow:0 20px 40px rgba(0,0,0,.35);
      backdrop-filter: blur(6px);
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:20px;
      gap:12px;
      flex-wrap:wrap;
    }

    h1{
      font-size:1.35rem;
      font-weight:700;
      letter-spacing:.2px;
    }

    .badge{
      background:rgba(34,197,94,.15);
      color:#86efac;
      border:1px solid rgba(34,197,94,.35);
      padding:6px 10px;
      border-radius:999px;
      font-size:.82rem;
    }

    .grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:14px;
    }

    .card{
      background:#0b1220;
      border:1px solid var(--border);
      border-radius:14px;
      padding:16px;
    }

    .card h2{
      font-size:1rem;
      margin-bottom:10px;
    }

    .muted{color:var(--muted); font-size:.92rem; margin-bottom:14px;}

    .field{
      display:flex;
      flex-direction:column;
      gap:6px;
      margin-bottom:12px;
    }

    label{font-size:.9rem; color:#cbd5e1;}
    input, textarea, select{
      width:100%;
      background:#0f172a;
      border:1px solid #263244;
      color:var(--text);
      border-radius:10px;
      padding:10px 12px;
      outline:none;
      transition:.2s border-color, .2s box-shadow;
    }

    input:focus, textarea:focus, select:focus{
      border-color:var(--primary);
      box-shadow:0 0 0 3px rgba(59,130,246,.25);
    }

    .actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:8px;
    }

    button{
      border:none;
      background:var(--primary);
      color:#fff;
      border-radius:10px;
      padding:10px 14px;
      font-weight:600;
      cursor:pointer;
      transition:.2s background, .2s transform;
    }
    button:hover{background:var(--primary-hover)}
    button:active{transform:translateY(1px)}
    .btn-secondary{
      background:#1f2937;
      border:1px solid #334155;
    }

    .list{
      list-style:none;
      display:flex;
      flex-direction:column;
      gap:8px;
      margin-top:8px;
    }

    .item{
      border:1px solid #253043;
      background:#0f172a;
      border-radius:10px;
      padding:10px 12px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px;
    }

    @media (max-width: 800px){
      .grid{grid-template-columns:1fr;}
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>Painel do Projeto</h1>
      <span class="badge">Interface melhorada</span>
    </header>

    <section class="grid">
      <article class="card">
        <h2>Formulário</h2>
        <p class="muted">Campos com foco visual e botões mais limpos.</p>

        <div class="field">
          <label>Nome</label>
          <input type="text" placeholder="Digite seu nome" />
        </div>

        <div class="field">
          <label>Mensagem</label>
          <textarea rows="4" placeholder="Digite sua mensagem"></textarea>
        </div>

        <div class="actions">
          <button>Salvar</button>
          <button class="btn-secondary">Cancelar</button>
        </div>
      </article>

      <article class="card">
        <h2>Itens recentes</h2>
        <p class="muted">Lista com visual de cards compactos.</p>
        <ul class="list">
          <li class="item"><span>Item 1</span><small>Hoje</small></li>
          <li class="item"><span>Item 2</span><small>Ontem</small></li>
          <li class="item"><span>Item 3</span><small>2 dias</small></li>
        </ul>
      </article>
    </section>
  </main>
</body>
</html>
