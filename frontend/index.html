<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Livros da Rafa</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(135deg, #0b1020 0%, #1a1b2f 50%, #0f172a 100%);
  color: #e2e8f0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 32px 20px;
  line-height: 1.6;
}
.app { width: 100%; max-width: 800px; }
.card {
  background: #131c34;
  border: 1px solid #2f3b5d;
  border-radius: 20px;
  padding: 28px;
  margin-bottom: 24px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  transition: all 0.3s ease;
}
.card:hover {
  transform: translateY(-4px);
  border-color: #ff63b3;
  box-shadow: 0 20px 50px rgba(0,0,0,0.5);
}
.card h2 {
  margin: 0 0 16px 0;
  font-size: 32px;
  font-weight: 700;
  background: linear-gradient(135deg, #ffd1ea 0%, #ff7fc4 50%, #ff4da6 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.card h3 {
  margin: 0 0 20px 0;
  font-size: 22px;
  font-weight: 600;
  color: #f8fafc;
  display: flex;
  align-items: center;
  gap: 12px;
}
.row { display: flex; gap: 16px; align-items: stretch; }
input {
  flex: 1;
  padding: 20px 24px;
  border-radius: 16px;
  border: 2px solid #334155;
  background: #0f172a;
  color: #f1f5f9;
  font-size: 16px;
  font-weight: 500;
  transition: all 0.3s ease;
}
input:focus {
  outline: none;
  border-color: #ff6ab8;
  box-shadow: 0 0 0 4px rgba(255,106,184,0.2);
}
input::placeholder { color: #94a3b8; }
button {
  padding: 20px 28px;
  border: none;
  border-radius: 16px;
  background: linear-gradient(135deg, #ff63b3, #d6368f);
  color: white;
  font-weight: 600;
  font-size: 16px;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 8px 25px rgba(214,54,143,0.35);
  display: flex;
  align-items: center;
  gap: 8px;
}
button:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 12px 35px rgba(214,54,143,0.45);
}
button:disabled { opacity: 0.6; cursor: not-allowed; }
.spinner {
  width: 20px;
  height: 20px;
  border: 2px solid rgba(255,255,255,0.3);
  border-radius: 50%;
  border-top-color: #fff;
  animation: spin 1s ease-in-out infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.options-container { display: flex; flex-direction: column; gap: 16px; }
.option {
  padding: 24px;
  border-radius: 16px;
  border: 2px solid #334155;
  background: #0f172a;
  cursor: pointer;
  transition: all 0.3s ease;
}
.option:nth-child(1) { border-color: #475569; }
.option:nth-child(2) { border-color: #475569; }
.option:nth-child(3) { border-color: #475569; }
.option:nth-child(4) { border-color: #475569; }
.option:nth-child(5) ~ .option { border-color: #475569; }
.option:hover {
  transform: translateY(-4px);
  box-shadow: 0 15px 40px rgba(214,54,143,0.25);
  border-color: #ff63b3 !important;
}
.option b {
  font-size: 18px;
  color: #f8fafc;
  display: block;
  margin-bottom: 12px;
}
.small {
  font-size: 15px;
  color: #cbd5e1;
  line-height: 1.6;
}
.download-link {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  padding: 18px 28px;
  background: linear-gradient(135deg, #ff63b3, #d6368f);
  color: white;
  text-decoration: none;
  border-radius: 14px;
  font-weight: 600;
  font-size: 16px;
  transition: all 0.3s ease;
  box-shadow: 0 8px 25px rgba(214,54,143,0.35);
  margin-top: 16px;
}
.download-link:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 35px rgba(214,54,143,0.45);
}
.empty-state {
  text-align: center;
  padding: 32px 24px;
  color: #94a3b8;
}
@media (max-width: 768px) {
  body { padding: 24px 16px; }
  .card { padding: 24px 20px; }
  .row { flex-direction: column; }
  button { width: 100%; }
}
</style>
</head>
<body>
<div class="app">
  <div class="card">
    <h2>Biblioteca da Rafa</h2>
    <div class="small">
      Boa leitura, Rafa 🩷<br>
      Feito pro cê baixar livro de graça!
    </div>
    <div class="row" style="margin-top: 20px;">
      <input id="input" placeholder="O que você quer ler hoje, Rafa?"/>
      <button id="btn">
        <span id="btn-text">🔍 Buscar</span>
        <span id="btn-spinner" class="spinner" style="display:none;"></span>
      </button>
    </div>
    <div id="status" class="small" style="margin-top: 12px;">
      Todas opções do universo pra você 🌺
    </div>
  </div>

  <div class="card">
    <h3>✨ Sugestões pra você</h3>
    <div id="options" class="options-container">—</div>
  </div>

  <div class="card">
    <h3>⬇️ Seu livro</h3>
    <div id="download" class="small">Clique numa opção acima!</div>
  </div>
</div>

<script>
const API = "https://livros-hfxv.onrender.com";

async function callSearch(query) {
  const res = await fetch(`${API}/search`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ query })
  });

  const data = await res.json();
  if (!res.ok) {
    throw new Error(data?.detail || "Erro ao consultar API");
  }
  return data;
}

async function callSelect(command) {
  const res = await fetch(`${API}/select`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ command })
  });

  const data = await res.json();
  if (!res.ok) {
    throw new Error(data?.detail || "Erro ao selecionar livro");
  }
  return data;
}

function cleanOptionTitle(rawTitle) {
  const title = String(rawTitle || "").trim();
  const cleaned = title
    .replace(/^📚\s*on your request:?\s*/i, "")
    .replace(/\bon your request:?\s*/i, "")
    .trim();

  return cleaned || "Livro";
}

function normalizeBookOption(option, index) {
  if (typeof option === "string") {
    const command = option.trim();
    return {
      command,
      title: `Livro ${index + 1}`,
      author: "Autor desconhecido",
      language: "—",
      format: "",
      size: ""
    };
  }

  return {
    command: option?.command || "",
    title: option?.title || `Livro ${index + 1}`,
    author: option?.author || "Autor desconhecido",
    language: option?.language || "—",
    format: option?.format || "",
    size: option?.size || ""
  };
}

function normalizeDownloadFilename(rawFilename) {
  const original = String(rawFilename || "arquivo.epub").trim();
  const dotIndex = original.lastIndexOf(".");
  const hasExt = dotIndex > 0;
  const ext = hasExt ? original.slice(dotIndex) : ".epub";
  const base = hasExt ? original.slice(0, dotIndex) : original;

  const cleaned = base
    .replace(/_/g, " ")
    .replace(/\b(?:z\s*-?\s*library|z\s*-?\s*lib|1lib|lib\s*sk|sk)\b/gi, "")
    .replace(/\s*,\s*/g, " ")
    .replace(/\s+/g, " ")
    .trim();

  return `${cleaned || "livro"}${ext}`;
}

function renderOptions(options) {
  const container = document.getElementById("options");
  if (!Array.isArray(options) || !options.length) {
    container.innerHTML = '<div class="empty-state">Nada encontrado agora, Rafa 😕<br><small>Tenta outra busca?</small></div>';
    return;
  }

  const normalizedOptions = options.map((option, index) => normalizeBookOption(option, index));

  container.innerHTML = normalizedOptions.map((book) => `
    <div class="option" data-command="${book.command || ""}">
      <b>📚 ${cleanOptionTitle(book.title)}</b>
      <div class="small">
        <strong>${book.author || "Autor desconhecido"}</strong><br>
        🌐 ${book.language || "—"}<br>
        ${(book.format || "Formato não informado")} ${(book.size || "")}<br>
        <small>${book.command || ""}</small>
      </div>
    </div>
  `).join("");
}

function renderDownload(documentPayload) {
  const downloadEl = document.getElementById("download");
  if (!documentPayload?.download_url) {
    downloadEl.textContent = "Ainda não recebi arquivo 😕";
    return;
  }

  const url = documentPayload.download_url.startsWith("http")
    ? documentPayload.download_url
    : API + documentPayload.download_url;
  const prettyFilename = normalizeDownloadFilename(documentPayload.filename);

  downloadEl.innerHTML = `
    📖 Aqui está seu livro!<br>
    <a class="download-link" href="${url}" download="${prettyFilename}" target="_blank" rel="noopener noreferrer">
      ⬇️ Baixar ${prettyFilename}
    </a>
  `;
}

document.getElementById("btn").onclick = async () => {
  const input = document.getElementById("input");
  const query = input.value.trim();
  if (!query) return;

  const btn = document.getElementById("btn");
  const btnText = document.getElementById("btn-text");
  const spinner = document.getElementById("btn-spinner");
  const status = document.getElementById("status");

  btn.disabled = true;
  btnText.style.display = "none";
  spinner.style.display = "inline-block";
  status.textContent = "Procurando seu livro... ✨";

  try {
    const data = await callSearch(query);
    renderOptions(data.options || []);
    document.getElementById("download").textContent = "Clique numa opção acima!";
    status.textContent = "Escolhe com calma 🩷";
  } catch (error) {
    status.textContent = `Erro na busca 😕 ${error.message || ""}`;
  } finally {
    btn.disabled = false;
    btnText.style.display = "inline";
    spinner.style.display = "none";
  }
};

document.getElementById("input").onkeypress = (e) => {
  if (e.key === "Enter") document.getElementById("btn").click();
};

document.getElementById("options").onclick = async (e) => {
  const el = e.target.closest(".option");
  if (!el) return;

  const command = el.dataset.command;
  if (!command) return;

  const status = document.getElementById("status");
  status.textContent = "Buscando seu livro... 💙";

  try {
    const data = await callSelect(command);
    renderDownload(data.document);
    status.textContent = data.document?.download_url
      ? "Livro pronto para download ✅"
      : "Ainda sem arquivo, tente outra opção ✨";
  } catch (error) {
    status.textContent = `Erro ao selecionar 😕 ${error.message || ""}`;
  }
};
</script>
</body>
</html>
