<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Busca de Livros via Telegram</title>
  <style>
    :root {
      --bg: #0b1020;
      --card: #131c34;
      --card-2: #0f172a;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --border: #27324d;
      --ok: #10b981;
      --error: #f87171;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Inter, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(circle at top, #172554, var(--bg));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .app {
      width: min(820px, 100%);
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.35);
      padding: 22px;
    }

    h1 {
      font-size: 1.3rem;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 18px;
      font-size: 0.94rem;
    }

    .row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    input {
      flex: 1;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 16px;
      padding: 11px 12px;
      outline: none;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.25);
    }

    button {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      padding: 11px 14px;
      cursor: pointer;
      min-width: 100px;
    }

    button:hover:not(:disabled) { background: var(--primary-hover); }
    button:disabled { opacity: .7; cursor: not-allowed; }

    .box {
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-top: 10px;
    }

    .label {
      color: var(--muted);
      font-size: .85rem;
      margin-bottom: 6px;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
      font-family: inherit;
      line-height: 1.5;
      min-height: 54px;
    }

    #options { color: #cbd5e1; }
    #download a {
      color: #93c5fd;
      text-decoration: none;
      font-weight: 600;
    }
    #download a:hover { text-decoration: underline; }

    .status {
      margin-top: 12px;
      color: var(--ok);
      font-size: .88rem;
    }

    .status.error { color: var(--error); }

    @media (max-width: 680px) {
      .row { flex-direction: column; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>Buscar livro no bot do Telegram</h1>
    <p class="subtitle">Frontend no Netlify + backend no Render</p>

    <div class="row">
      <input id="queryInput" type="text" placeholder="Digite o nome do livro" />
      <button id="searchBtn">Buscar</button>
    </div>

    <div class="box">
      <p class="label">Resposta</p>
      <pre id="result">Aguardando pesquisa...</pre>
    </div>

    <div class="box">
      <p class="label">Opções</p>
      <p id="options">—</p>
    </div>

    <div class="box">
      <p class="label">Download</p>
      <p id="download">—</p>
    </div>

    <p id="status" class="status">API: https://livros-hfxv.onrender.com</p>
  </main>

  <script>
    const API_BASE_URL = 'https://livros-hfxv.onrender.com';

    async function searchBook() {
      const input = document.getElementById('queryInput');
      const result = document.getElementById('result');
      const options = document.getElementById('options');
      const download = document.getElementById('download');
      const status = document.getElementById('status');
      const button = document.getElementById('searchBtn');
      const query = input.value.trim();

      if (!query) {
        result.textContent = 'Digite um nome de livro.';
        options.textContent = '—';
        download.textContent = '—';
        status.classList.add('error');
        status.textContent = 'Digite algo para pesquisar.';
        return;
      }

      button.disabled = true;
      result.textContent = 'Consultando bot...';
      options.textContent = '—';
      download.textContent = '—';
      status.classList.remove('error');
      status.textContent = 'Consultando backend...';

      try {
        const response = await fetch(`${API_BASE_URL}/search`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query })
        });

        const data = await response.json();

        if (!response.ok) {
          result.textContent = `Erro: ${data.detail || 'Falha na requisição.'}`;
          status.classList.add('error');
          status.textContent = 'Backend respondeu com erro.';
          return;
        }

        result.textContent = data.response || '(sem texto na resposta)';

        if (Array.isArray(data.options) && data.options.length > 0) {
          options.textContent = data.options.join(' | ');
        }

        if (data.document && data.document.download_url) {
          const url = `${API_BASE_URL}${data.document.download_url}`;
          const filename = data.document.filename || 'arquivo';
          download.innerHTML = `📥 <a href="${url}" target="_blank" rel="noopener">Baixar ${filename}</a>`;
        }

        status.classList.remove('error');
        status.textContent = 'Consulta concluída com sucesso.';
      } catch (error) {
        result.textContent = `Erro de conexão: ${error.message}`;
        status.classList.add('error');
        status.textContent = 'Falha ao conectar no Render.';
      } finally {
        button.disabled = false;
      }
    }

    document.getElementById('searchBtn').addEventListener('click', searchBook);
    document.getElementById('queryInput').addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        searchBook();
      }
    });
  </script>
</body>
</html>
