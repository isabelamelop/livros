services:
  - type: web
    name: telegram-search-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_USERNAME
        value: livrosisabblinhabot
      - key: SESSION_NAME
        value: telegram_user
      - key: RESPONSE_TIMEOUT
        value: "10"
